services:
  organiza-club-supabase-db:
    image: supabase/postgres:15.8.1.060
    container_name: organiza-club-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: /var/run/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    volumes:
      - supabase_db_data-20260529:/var/lib/postgresql/data
    networks:
      - organiza_club_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  organiza-club-supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: organiza-club-supabase-meta
    restart: unless-stopped
    depends_on:
      organiza-club-supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: organiza-club-supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: ${POSTGRES_USER:-supabase_admin}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - organiza_club_net

  organiza-club-supabase-studio:
    image: supabase/studio:latest
    container_name: organiza-club-supabase-studio
    restart: unless-stopped
    depends_on:
      - organiza-club-supabase-meta
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      STUDIO_PG_META_URL: http://organiza-club-supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Organiza Club
      DEFAULT_PROJECT_NAME: Organiza Club
      SUPABASE_URL: http://localhost:8000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: local-anon-key-not-used-by-organiza-club
      SUPABASE_SERVICE_KEY: local-service-key-not-used-by-organiza-club
    ports:
      - "127.0.0.1:${STUDIO_PORT:-54323}:3000"
    networks:
      - organiza_club_net
    healthcheck:
      disable: true

volumes:
  supabase_db_data-20260529:

networks:
  organiza_club_net:
    external: true
