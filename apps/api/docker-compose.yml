services:
  organiza-club-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: organiza-club-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    networks:
      - organiza_club_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  organiza_club_net:
    external: true
