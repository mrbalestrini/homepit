openapi: 3.1.0
info:
  title: HomePit API
  version: 0.1.1
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: API healthy
  /api/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
  /api/institutional-page:
    get:
      security: []
      responses:
        "200":
          description: Public institutional page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
  /api/institutional-page/images/{slot}:
    get:
      security: []
      parameters:
        - $ref: "#/components/parameters/InstitutionalImageSlot"
      responses:
        "200":
          description: Public institutional image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /api/admin/institutional-page:
    get:
      responses:
        "200":
          description: Institutional page content for the CMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstitutionalPageRequest"
      responses:
        "200":
          description: Institutional page saved and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
  /api/admin/institutional-page/images/{slot}:
    post:
      parameters:
        - $ref: "#/components/parameters/InstitutionalImageSlot"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Institutional image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
    delete:
      parameters:
        - $ref: "#/components/parameters/InstitutionalImageSlot"
      responses:
        "200":
          description: Institutional image deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
  /api/households:
    get:
      responses:
        "200":
          description: User households
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Household"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Household created
  /api/households/members:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Household members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseholdMember"
  /api/households/share:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareHouseholdRequest"
      responses:
        "201":
          description: Household shared with existing user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
  /api/households/members/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdMemberRequest"
      responses:
        "200":
          description: Household member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Household member removed without deleting historical records
  /api/users/me:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Current user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/users/me/profile-photo:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Current user profile photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    get:
      responses:
        "200":
          description: Current user profile photo
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Profile photo not found
  /api/finance/periods:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Financial periods for the active household
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancePeriodListItem"
  /api/finance/periods/{year}/{month}:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Financial period detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancePeriodDetail"
  /api/finance/periods/{year}/{month}/generate:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: year
          in: path
          required: true
          schema:
            type: integer
        - name: month
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFinancePeriodRequest"
      responses:
        "200":
          description: Generated or updated financial period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancePeriodDetail"
  /api/finance/categories:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Finance categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceCategory"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceCategoryRequest"
      responses:
        "201":
          description: Finance category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategory"
  /api/finance/categories/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceCategoryRequest"
      responses:
        "200":
          description: Finance category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceCategory"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Finance category deleted
  /api/finance/recurring-templates:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Recurring finance templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceRecurringTemplate"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceRecurringTemplateRequest"
      responses:
        "201":
          description: Recurring finance template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceRecurringTemplate"
  /api/finance/recurring-templates/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFinanceRecurringTemplateRequest"
      responses:
        "200":
          description: Recurring finance template updated
          content:
