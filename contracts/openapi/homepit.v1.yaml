openapi: 3.1.0
info:
  title: HomePit API
  version: 0.1.1
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: API healthy
  /api/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
  /api/institutional-page:
    get:
      security: []
      responses:
        "200":
          description: Public institutional page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
  /api/institutional-page/images/{slot}:
    get:
      security: []
      parameters:
        - $ref: "#/components/parameters/InstitutionalImageSlot"
      responses:
        "200":
          description: Public institutional image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
  /api/admin/institutional-page:
    get:
      responses:
        "200":
          description: Institutional page content for the CMS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstitutionalPageRequest"
      responses:
        "200":
          description: Institutional page saved and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
  /api/admin/institutional-page/images/{slot}:
    post:
      parameters:
        - $ref: "#/components/parameters/InstitutionalImageSlot"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Institutional image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
    delete:
      parameters:
        - $ref: "#/components/parameters/InstitutionalImageSlot"
      responses:
        "200":
          description: Institutional image deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionalPage"
        "403":
          description: SuperAdmin role required
  /api/households:
    get:
      responses:
        "200":
          description: User households
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Household"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Household created
  /api/households/members:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Household members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseholdMember"
  /api/households/share:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareHouseholdRequest"
      responses:
        "201":
          description: Household shared with existing user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
  /api/households/members/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdMemberRequest"
      responses:
        "200":
          description: Household member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Household member removed without deleting historical records
  /api/users/me:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Current user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/users/me/profile-photo:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Current user profile photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    get:
      responses:
        "200":
          description: Current user profile photo
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Profile photo not found
  /api/gsm-numbers:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: GSM numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GsmNumber"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGsmNumberRequest"
      responses:
        "201":
          description: GSM number created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsmNumber"
  /api/gsm-numbers/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGsmNumberRequest"
      responses:
        "200":
          description: GSM number updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsmNumber"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: GSM number deleted
  /api/gsm-numbers/{id}/recharges:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: GSM recharge history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GsmRecharge"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGsmRechargeRequest"
      responses:
        "201":
          description: GSM recharge recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsmRecharge"
  /api/gsm-numbers/{id}/recharges/{rechargeId}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/RechargeIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGsmRechargeRequest"
      responses:
        "200":
          description: GSM recharge updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GsmRecharge"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/RechargeIdPath"
      responses:
        "204":
          description: GSM recharge deleted
  /api/universes:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Universes
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUniverseRequest"
      responses:
        "201":
          description: Universe created
  /api/universes/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUniverseRequest"
      responses:
        "200":
          description: Universe updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Universe deleted
  /api/projects:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: universeId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Projects
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
  /api/projects/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Project deleted
  /api/prompts:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: search
          in: query
          schema:
            type: string
            nullable: true
        - name: universeId
          in: query
          schema:
            type: string
            format: uuid
            nullable: true
        - name: withoutUniverse
          in: query
          schema:
            type: boolean
            default: false
        - name: categoryId
          in: query
          description: Repeat the query parameter to filter by one or more categories using OR semantics.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
      responses:
        "200":
          description: Prompt cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListResponse"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
      responses:
        "201":
          description: Prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
  /api/prompts/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Prompt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptRequest"
      responses:
        "200":
          description: Prompt updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Prompt deleted
  /api/prompts/{id}/image:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Prompt image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Prompt image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Prompt image not found
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Prompt image removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
  /api/prompt-categories:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Prompt categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptCategory"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptCategoryRequest"
      responses:
        "201":
          description: Prompt category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCategory"
  /api/prompt-categories/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptCategoryRequest"
      responses:
        "200":
          description: Prompt category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCategory"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
        - name: replacementCategoryId
          in: query
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        "204":
          description: Prompt category deleted
  /api/activities:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActivityStatus"
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /api/activities/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Activity deleted
  /api/activities/{id}/status:
    patch:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ActivityStatus"
      responses:
        "200":
          description: Activity status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /api/activities/{id}/image:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Activity image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Activity image not found
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity image removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /api/activities/{id}/comments:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityComment"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityCommentRequest"
      responses:
        "201":
          description: Activity comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityComment"
  /api/activities/{activityId}/comments/{commentId}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityCommentRequest"
      responses:
        "200":
          description: Activity comment updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Activity comment deleted
  /api/activities/{id}/pending-items:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pending items
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePendingItemRequest"
      responses:
        "201":
          description: Pending item created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HouseholdHeader:
      name: X-Household-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RechargeIdPath:
      name: rechargeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstitutionalImageSlot:
      name: slot
      in: path
      required: true
      schema:
        type: string
        enum: [hero, highlight, seo]
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        householdName:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    InstitutionalContentItem:
      type: object
      required: [position, title, description]
      properties:
        position:
          type: integer
          minimum: 0
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 600
    InstitutionalContentItemRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 600
    InstitutionalPage:
