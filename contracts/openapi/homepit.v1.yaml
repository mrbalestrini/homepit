      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditCardTransactionRequest"
      responses:
        "201":
          description: Credit card transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditCardTransaction"
  /api/finance/credit-cards/{id}/transactions/import:
