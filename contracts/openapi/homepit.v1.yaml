openapi: 3.1.0
info:
  title: HomePit API
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: API healthy
  /api/auth/register:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
  /api/households:
    get:
      responses:
        "200":
          description: User households
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Household"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Household created
  /api/households/members:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Household members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseholdMember"
  /api/households/share:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareHouseholdRequest"
      responses:
        "201":
          description: Household shared with existing user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
  /api/households/members/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHouseholdMemberRequest"
      responses:
        "200":
          description: Household member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMember"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Household member removed without deleting historical records
  /api/users/me:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Current user updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /api/users/me/profile-photo:
    post:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Current user profile photo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    get:
      responses:
        "200":
          description: Current user profile photo
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Profile photo not found
  /api/universes:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Universes
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUniverseRequest"
      responses:
        "201":
          description: Universe created
  /api/universes/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUniverseRequest"
      responses:
        "200":
          description: Universe updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Universe deleted
  /api/projects:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: universeId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Projects
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
  /api/projects/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Project deleted
  /api/prompts:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: search
          in: query
          schema:
            type: string
            nullable: true
        - name: universeId
          in: query
          schema:
            type: string
            format: uuid
            nullable: true
        - name: withoutUniverse
          in: query
          schema:
            type: boolean
            default: false
        - name: categoryId
          in: query
          description: Repeat the query parameter to filter by one or more categories using OR semantics.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
      responses:
        "200":
          description: Prompt cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptListResponse"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
      responses:
        "201":
          description: Prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
  /api/prompts/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Prompt detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptRequest"
      responses:
        "200":
          description: Prompt updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Prompt deleted
  /api/prompts/{id}/image:
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Prompt image updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Prompt image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Prompt image not found
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Prompt image removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
  /api/prompt-categories:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Prompt categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptCategory"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptCategoryRequest"
      responses:
        "201":
          description: Prompt category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCategory"
  /api/prompt-categories/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePromptCategoryRequest"
      responses:
        "200":
          description: Prompt category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptCategory"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
        - name: replacementCategoryId
          in: query
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        "204":
          description: Prompt category deleted
  /api/activities:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActivityStatus"
      responses:
        "200":
          description: Activities
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityRequest"
      responses:
        "201":
          description: Activity created
  /api/activities/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityRequest"
      responses:
        "200":
          description: Activity updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Activity deleted
  /api/activities/{id}/status:
    patch:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ActivityStatus"
      responses:
        "200":
          description: Activity status updated
  /api/activities/{id}/comments:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Activity comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityComment"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityCommentRequest"
      responses:
        "201":
          description: Activity comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityComment"
  /api/activities/{activityId}/comments/{commentId}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityCommentRequest"
      responses:
        "200":
          description: Activity comment updated
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: activityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Activity comment deleted
  /api/activities/{id}/pending-items:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pending items
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePendingItemRequest"
      responses:
        "201":
          description: Pending item created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HouseholdHeader:
      name: X-Household-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        householdName:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresAt, user, households]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/UserProfile"
        households:
          type: array
          items:
            $ref: "#/components/schemas/Household"
    Household:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          enum: [Owner, Admin, Member]
    HouseholdMember:
      type: object
      required: [id, userId, displayName, email, role, isCurrentUser]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
          nullable: true
        role:
          enum: [Owner, Admin, Member]
        isCurrentUser:
          type: boolean
    ShareHouseholdRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          enum: [Admin, Member]
    UpdateHouseholdMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          enum: [Admin, Member]
    CreateUniverseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
    UpdateUniverseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        phoneNumber:
          type: string
          nullable: true
    UserProfile:
      type: object
      required: [id, email, displayName, systemRole, hasProfilePhoto]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        systemRole:
          enum: [User, Admin, SuperAdmin]
        hasProfilePhoto:
          type: boolean
        profilePhotoUpdatedAt:
          type: string
          format: date-time
          nullable: true
    CreateProjectRequest:
      type: object
      required: [universeId, name]
      properties:
        universeId:
          type: string
          format: uuid
        name:
          type: string
    UpdateProjectRequest:
      type: object
      required: [universeId, name]
      properties:
        universeId:
          type: string
          format: uuid
        name:
          type: string
    CreatePromptRequest:
      type: object
      required: [title, promptText, categoryIds]
      properties:
        universeId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        promptText:
          type: string
          maxLength: 20000
        categoryIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        linkUrl:
          type: string
          format: uri
          nullable: true
        linkTitle:
          type: string
          nullable: true
    UpdatePromptRequest:
      type: object
      required: [title, promptText, categoryIds]
      properties:
        universeId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        promptText:
          type: string
          maxLength: 20000
        categoryIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        linkUrl:
          type: string
          format: uri
          nullable: true
        linkTitle:
          type: string
          nullable: true
    PromptCategoryReference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PromptListItem:
      type: object
      required:
        [
          id,
          title,
          promptText,
          categories,
          hasImage,
          updatedAt,
          canEdit,
          canDelete
        ]
      properties:
        id:
          type: string
          format: uuid
        universeId:
          type: string
          format: uuid
          nullable: true
        universeName:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        promptText:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PromptCategoryReference"
        linkUrl:
          type: string
          format: uri
          nullable: true
        linkTitle:
          type: string
          nullable: true
        createdByMemberId:
          type: string
          format: uuid
          nullable: true
        hasImage:
          type: boolean
        imageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        canEdit:
          type: boolean
        canDelete:
          type: boolean
    PromptListResponse:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PromptListItem"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
    PromptDetail:
      type: object
      required:
        [
          id,
          title,
          promptText,
          categories,
          hasImage,
          createdAt,
          updatedAt,
          canEdit,
          canDelete
        ]
      properties:
        id:
          type: string
          format: uuid
        universeId:
          type: string
          format: uuid
          nullable: true
        universeName:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        promptText:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PromptCategoryReference"
        linkUrl:
          type: string
          format: uri
          nullable: true
        linkTitle:
          type: string
          nullable: true
        createdByMemberId:
          type: string
          format: uuid
          nullable: true
        hasImage:
          type: boolean
        imageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        canEdit:
          type: boolean
        canDelete:
          type: boolean
    CreatePromptCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    UpdatePromptCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    PromptCategory:
      type: object
      required:
        [
          id,
          name,
          usageCount,
          replacementRequiredCount,
          canEdit,
          canDelete
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdByMemberId:
          type: string
          format: uuid
          nullable: true
        usageCount:
          type: integer
        replacementRequiredCount:
          type: integer
        canEdit:
          type: boolean
        canDelete:
          type: boolean
    ActivityStatus:
      type: string
      enum: [NaoIniciada, EmAndamento, Concluido]
    Priority:
      type: string
      enum: [Baixa, Media, Alta, Urgente]
    CreateActivityRequest:
      type: object
      required: [projectId, title, status, priority]
      properties:
        projectId:
          type: string
