        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Recurring finance template deleted
  /api/finance/entries:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - name: year
          in: query
          schema:
            type: integer
            nullable: true
        - name: month
          in: query
          schema:
            type: integer
            nullable: true
      responses:
        "200":
          description: Finance entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinanceEntry"
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFinanceEntryRequest"
      responses:
        "201":
          description: Finance entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceEntry"
  /api/finance/entries/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
