      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetValuationRequest"
      responses:
        "200":
          description: Asset valuation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetValuation"
    delete:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
        - $ref: "#/components/parameters/IdPath"
        - name: valuationId
          in: path
          required: true
