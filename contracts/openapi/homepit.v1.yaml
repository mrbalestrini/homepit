  /api/universes:
    get:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      responses:
        "200":
          description: Universes
    post:
      parameters:
        - $ref: "#/components/parameters/HouseholdHeader"
      requestBody:
        required: true
        content:
          application/json:
