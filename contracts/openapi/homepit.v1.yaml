components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    HouseholdHeader:
      name: X-Household-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RechargeIdPath:
      name: rechargeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstitutionalImageSlot:
      name: slot
      in: path
      required: true
      schema:
        type: string
        enum: [hero, highlight, seo]
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        householdName:
          type: string
          nullable: true
        phoneNumber:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    InstitutionalContentItem:
      type: object
      required: [position, title, description]
      properties:
        position:
          type: integer
          minimum: 0
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 600
    InstitutionalContentItemRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 600
    InstitutionalPage:
      type: object
      required:
        - slug
        - seoTitle
        - seoDescription
        - brandName
        - brandTagline
        - heroEyebrow
        - heroTitle
        - heroDescription
        - primaryCtaLabel
        - primaryCtaUrl
        - benefitsTitle
        - benefitsDescription
        - benefits
        - stepsTitle
        - stepsDescription
        - steps
        - highlightEyebrow
        - highlightTitle
        - highlightDescription
        - finalCtaTitle
        - finalCtaDescription
        - footerText
        - heroImageAlt
        - hasHeroImage
        - highlightImageAlt
        - hasHighlightImage
        - hasSeoImage
      properties:
        slug:
          type: string
        seoTitle:
          type: string
        seoDescription:
          type: string
        hasSeoImage:
          type: boolean
        seoImageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        brandName:
          type: string
        brandTagline:
          type: string
        heroEyebrow:
          type: string
        heroTitle:
          type: string
        heroDescription:
          type: string
        primaryCtaLabel:
          type: string
        primaryCtaUrl:
          type: string
          format: uri
        benefitsTitle:
          type: string
        benefitsDescription:
          type: string
        benefits:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/InstitutionalContentItem"
        stepsTitle:
          type: string
        stepsDescription:
          type: string
        steps:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/InstitutionalContentItem"
        highlightEyebrow:
          type: string
        highlightTitle:
          type: string
        highlightDescription:
          type: string
        finalCtaTitle:
          type: string
        finalCtaDescription:
          type: string
        footerText:
          type: string
        heroImageAlt:
          type: string
        hasHeroImage:
          type: boolean
        heroImageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        highlightImageAlt:
          type: string
        hasHighlightImage:
          type: boolean
        highlightImageUpdatedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    UpdateInstitutionalPageRequest:
      type: object
      required:
        - seoTitle
        - seoDescription
        - brandName
        - brandTagline
        - heroEyebrow
        - heroTitle
        - heroDescription
        - primaryCtaLabel
        - primaryCtaUrl
        - benefitsTitle
        - benefitsDescription
        - benefits
        - stepsTitle
        - stepsDescription
        - steps
        - highlightEyebrow
        - highlightTitle
        - highlightDescription
        - finalCtaTitle
        - finalCtaDescription
        - footerText
        - heroImageAlt
        - highlightImageAlt
      properties:
        seoTitle:
          type: string
          maxLength: 160
        seoDescription:
          type: string
          maxLength: 320
        brandName:
          type: string
          maxLength: 80
        brandTagline:
          type: string
          maxLength: 200
        heroEyebrow:
          type: string
          maxLength: 120
        heroTitle:
          type: string
          maxLength: 240
        heroDescription:
          type: string
          maxLength: 1200
        primaryCtaLabel:
          type: string
          maxLength: 80
        primaryCtaUrl:
          type: string
          format: uri
          maxLength: 2000
        benefitsTitle:
          type: string
          maxLength: 200
        benefitsDescription:
          type: string
          maxLength: 600
        benefits:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/InstitutionalContentItemRequest"
        stepsTitle:
          type: string
          maxLength: 200
        stepsDescription:
          type: string
          maxLength: 600
        steps:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/InstitutionalContentItemRequest"
        highlightEyebrow:
          type: string
          maxLength: 120
        highlightTitle:
          type: string
          maxLength: 240
        highlightDescription:
          type: string
          maxLength: 1200
        finalCtaTitle:
          type: string
          maxLength: 240
        finalCtaDescription:
          type: string
          maxLength: 1200
        footerText:
          type: string
          maxLength: 600
        heroImageAlt:
          type: string
          maxLength: 300
        highlightImageAlt:
          type: string
          maxLength: 300
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresAt, user, households]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
